<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search what you have read</title>
    <link rel="stylesheet" href="search.css" />
  </head>
  <body>
    <header>
      <input
        id="q"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="A phrase you remember"
        autofocus
      />
      <p id="meta" class="meta"></p>
    </header>

    <main id="results" aria-live="polite"></main>

    <footer>
      <span id="hint">↑ ↓ to move, enter to open, ctrl or cmd + enter for a background tab</span>
    </footer>

    <script type="module" src="search.js"></script>
  </body>
</html>
