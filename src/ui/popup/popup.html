<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Snow Mountain</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <button id="open" class="primary">Search what you have read</button>

    <section id="page" class="page">
      <p id="pageStatus" class="status">Checking this page…</p>
      <p id="pageUrl" class="host"></p>
      <div id="pageActions" class="actions"></div>
    </section>

    <p id="alert" class="callout warn" hidden></p>

    <section id="budgetBlock" class="budget" hidden>
      <div class="bar"><span id="fill"></span></div>
      <p id="budgetText" class="host"></p>
    </section>

    <h2>Recently kept</h2>
    <ul id="recent" class="recent"></ul>

    <div class="row">
      <button id="pause" class="link"></button>
      <button id="options" class="link">Settings</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
