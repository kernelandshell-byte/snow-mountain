<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Snow Mountain</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <button id="open" class="primary">Search what you have read</button>
    <p id="status" class="status">Loading…</p>
    <div id="budget" class="budget" hidden>
      <div class="bar"><span id="fill"></span></div>
      <p id="budgetText" class="muted"></p>
    </div>
    <h2>Recently kept</h2>
    <ul id="recent" class="recent"></ul>
    <div class="row">
      <button id="pause" class="link"></button>
      <button id="options" class="link">Settings</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
